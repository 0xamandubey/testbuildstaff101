<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Offline-first PWA for small businesses to track employee attendance, half-days, overtime, and salary payouts." />
    
    <!-- PWA configuration links -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS support meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Staff Attendance" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    
    <title>Staff Attendance & Wage Tracker</title>
    <!-- Capture PWA install prompt -->
    <script>
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });
    </script>
  </head>
  <body class="safe-bottom safe-top">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
